<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>L3G-World · Online Reconstruction</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><main id="online-reconstruction"><div class="scene-picker" id="scene-picker" aria-label="Choose an online reconstruction"></div><div class="stage"><div class="pane input-pane"><div class="label">Input Video</div><div class="viewport"><video id="input-video" muted playsinline preload="metadata"></video></div></div><div class="pane output-pane"><div class="label"><span>3D output</span><div class="modes" role="group" aria-label="Rendering mode"><button data-mode="rgb" aria-pressed="true">RGB</button><button data-mode="vae" aria-pressed="false">VAE (PCA)</button><button data-mode="half" aria-pressed="false">Half</button></div></div><div class="viewport rendering" id="rendering"><video id="rgb-video" muted playsinline preload="metadata"></video><video id="pca-video" muted playsinline preload="metadata"></video><svg class="diagonal" viewBox="0 0 832 480" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0 L832 480"/></svg><span class="pca-label">VAE (PCA)</span><span class="rgb-label">RGB</span></div><div class="transport"><button id="play" aria-label="Pause synchronized videos">Ⅱ</button><input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="Video position"><output id="time">0:00 / 0:00</output></div></div><p id="status" role="status">Loading videos…</p></div></main></body></html>
